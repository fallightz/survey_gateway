<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>설문 게이트웨이 관리</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#14262B; --muted:#56676B; --line:#D3DCDA; --paper:#F7F9F8; --surface:#FFFFFF;
  --accent:#0E7C66; --accent-soft:#E3F2EE; --danger:#B42318; --danger-soft:#FDECEA; --ok:#0E7C66;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#E8EFEE; --muted:#9AAAA8; --line:#2C3B3E; --paper:#111A1C; --surface:#172225;
    --accent:#4CC3A6; --accent-soft:#16352F; --danger:#F97066; --danger-soft:#3A1A18; --ok:#4CC3A6; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.55; word-break:keep-all; border-top:8px solid var(--accent); font-size:15px}
main{max-width:960px; margin:0 auto; padding:32px 20px 64px}
h1{font-size:26px; margin:0 0 4px; letter-spacing:-0.02em}
h2{font-size:18px; margin:0 0 14px}
.sub{color:var(--muted); margin:0 0 28px}
section{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:20px}
label{display:block; font-size:13px; color:var(--muted); margin:0 0 4px}
input[type=text],input[type=password],input[type=url],textarea{
  width:100%; font:inherit; color:var(--ink); background:var(--paper); border:1px solid var(--line);
  border-radius:6px; padding:9px 10px}
textarea{resize:vertical; min-height:64px}
input:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.grid{display:grid; gap:12px}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:640px){ .g3,.g2{grid-template-columns:1fr} }
button{font:inherit; cursor:pointer; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  border-radius:6px; padding:8px 14px}
button:hover{border-color:var(--muted)}
button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600}
@media (prefers-color-scheme: dark){ button.primary{color:#0B1F1A} }
button.icon{padding:6px 9px; line-height:1}
button.danger{color:var(--danger)}
.row{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.7fr) auto; gap:8px; align-items:center;
  padding:10px 0; border-bottom:1px solid var(--line)}
.row.hidden-item input{opacity:.55}
.row .tools{display:flex; gap:4px}
.head{font-size:13px; color:var(--muted); border-bottom:2px solid var(--ink); padding-bottom:6px}
@media (max-width:640px){ .row{grid-template-columns:1fr} .head{display:none} }
.bar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-top:14px}
.msg{margin:10px 0 0; font-size:14px; white-space:pre-line}
.msg.err{color:var(--danger)} .msg.ok{color:var(--ok)}
.check{display:flex; gap:8px; align-items:center; font-size:14px; color:var(--ink); margin-top:10px}
.hint{font-size:13px; color:var(--muted); margin:6px 0 0}
#editor[hidden]{display:none}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <h1>설문 게이트웨이 관리</h1>
  <p class="sub">직종과 설문 링크를 수정하고 저장하면 게이트웨이에 반영됩니다. 반영까지 보통 1~2분 걸립니다.</p>

  <section aria-labelledby="h-conn">
    <h2 id="h-conn">저장소 연결</h2>
    <div class="grid g3">
      <div><label for="owner">계정명(owner)</label><input type="text" id="owner" autocomplete="off"></div>
      <div><label for="repo">저장소명(repo)</label><input type="text" id="repo" autocomplete="off"></div>
      <div><label for="branch">브랜치</label><input type="text" id="branch" value="main" autocomplete="off"></div>
    </div>
    <div style="margin-top:12px">
      <label for="token">GitHub 토큰</label>
      <input type="password" id="token" autocomplete="off" placeholder="github_pat_로 시작하는 토큰">
      <p class="hint">토큰은 이 화면에만 잠시 머물며 어디에도 저장되지 않습니다. 창을 닫으면 다시 입력해야 합니다.</p>
    </div>
    <div class="bar">
      <a id="gwLink" href="./" target="_blank" rel="noopener">게이트웨이 열기</a>
      <button class="primary" id="btnLoad" type="button">불러오기</button>
    </div>
    <p class="msg" id="connMsg" role="status"></p>
  </section>

  <div id="editor" hidden>
    <section aria-labelledby="h-page">
      <h2 id="h-page">안내 문구</h2>
      <div class="grid g2">
        <div><label for="org">기관명</label><input type="text" id="org"></div>
        <div><label for="title">제목</label><input type="text" id="title"></div>
      </div>
      <div style="margin-top:12px"><label for="notice">안내문</label><textarea id="notice"></textarea></div>
      <div style="margin-top:12px"><label for="contact">하단 문의처 (비워두면 표시 안 함)</label><input type="text" id="contact"></div>
      <label class="check"><input type="checkbox" id="newTab"> 설문을 새 창으로 열기</label>
    </section>

    <section aria-labelledby="h-items">
      <h2 id="h-items">직종과 설문 링크</h2>
      <div class="row head"><span>직종명</span><span>설문 링크</span><span>표시 · 순서 · 삭제</span></div>
      <div id="rows"></div>
      <div class="bar">
        <button type="button" id="btnAdd">직종 추가</button>
        <button type="button" class="primary" id="btnSave">저장</button>
      </div>
      <p class="msg" id="saveMsg" role="status"></p>
    </section>
  </div>
</main>

<script>
(function(){
  var FILE_PATH = 'data/surveys.json';
  var API = 'https://api.github.com';
  var state = { data:null, sha:null, dirty:false };
  var $ = function(id){ return document.getElementById(id); };

  // 주소에서 계정명·저장소명 자동 추정 (계정명.github.io/저장소명/admin.html)
  (function guess(){
    var h = location.hostname;
    if (/\.github\.io$/i.test(h)){
      var owner = h.split('.')[0];
      var seg = location.pathname.split('/').filter(Boolean);
      var repo = (seg.length > 1) ? seg[0] : owner + '.github.io';
      $('owner').value = owner; $('repo').value = repo;
    }
  })();

  function msg(el, text, kind){ el.textContent = text; el.className = 'msg' + (kind ? ' ' + kind : ''); }

  // UTF-8 문자열 <-> Base64 (한글 깨짐 방지)
  function toB64(str){
    var bytes = new TextEncoder().encode(str), bin = '';
    for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function fromB64(b64){
    var bin = atob(b64.replace(/\s/g, '')), bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function conn(){
    return { owner:$('owner').value.trim(), repo:$('repo').value.trim(),
             branch:$('branch').value.trim() || 'main', token:$('token').value.trim() };
  }
  function apiUrl(c){ return API + '/repos/' + encodeURIComponent(c.owner) + '/' + encodeURIComponent(c.repo) + '/contents/' + FILE_PATH; }
  function headers(c){ return { 'Accept':'application/vnd.github+json', 'Authorization':'Bearer ' + c.token, 'X-GitHub-Api-Version':'2022-11-28' }; }

  function explain(status){
    if (status === 401) return '토큰이 올바르지 않거나 만료되었습니다. 토큰을 다시 확인해 주세요.';
    if (status === 403) return '이 토큰에 저장소 쓰기 권한이 없습니다. 토큰의 Contents 권한을 "Read and write"로 설정해 주세요.';
    if (status === 404) return '저장소나 data/surveys.json 파일을 찾지 못했습니다. 계정명·저장소명·브랜치와 토큰의 저장소 접근 범위를 확인해 주세요.';
    if (status === 409) return '다른 곳에서 먼저 수정되었습니다. "불러오기"로 최신 내용을 받은 뒤 다시 저장해 주세요.';
    if (status === 422) return '요청 형식 오류입니다. 잠시 후 다시 시도해 주세요.';
    return '오류가 발생했습니다 (코드 ' + status + '). 잠시 후 다시 시도해 주세요.';
  }

  // 불러오기
  $('btnLoad').onclick = function(){
    var c = conn();
    if (!c.owner || !c.repo){ msg($('connMsg'), '계정명과 저장소명을 입력해 주세요.', 'err'); return; }
    if (!c.token){ msg($('connMsg'), '토큰을 입력해 주세요.', 'err'); $('token').focus(); return; }
    if (state.dirty && !confirm('저장하지 않은 변경 사항이 있습니다. 다시 불러오면 사라집니다. 계속할까요?')) return;
    msg($('connMsg'), '불러오는 중입니다.');
    fetch(apiUrl(c) + '?ref=' + encodeURIComponent(c.branch), { headers:headers(c), cache:'no-store' })
      .then(function(r){ if (!r.ok) throw r.status; return r.json(); })
      .then(function(j){
        state.sha = j.sha;
        state.data = JSON.parse(fromB64(j.content));
        if (!Array.isArray(state.data.items)) state.data.items = [];
        state.data.items.forEach(function(it){ if (!it.id) it.id = newId(); if (it.visible === undefined) it.visible = true; });
        fillForm(); state.dirty = false;
        $('editor').hidden = false;
        msg($('connMsg'), '불러왔습니다. 직종 ' + state.data.items.length + '개', 'ok');
        msg($('saveMsg'), '');
      })
      .catch(function(e){ msg($('connMsg'), typeof e === 'number' ? explain(e) : '네트워크 오류 또는 파일 형식 오류입니다. 인터넷 연결과 surveys.json 내용을 확인해 주세요.', 'err'); });
  };

  function newId(){ return 'i' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function touch(){ state.dirty = true; msg($('saveMsg'), ''); }

  function fillForm(){
    var d = state.data;
    $('org').value = d.org || ''; $('title').value = d.title || '';
    $('notice').value = d.notice || ''; $('contact').value = d.contact || '';
    $('newTab').checked = !!d.openInNewTab;
    renderRows();
  }
  ['org','title','notice','contact'].forEach(function(k){ $(k).addEventListener('input', function(){ state.data[k] = this.value; touch(); }); });
  $('newTab').addEventListener('change', function(){ state.data.openInNewTab = this.checked; touch(); });

  function btn(text, label, cls, fn){
    var b = document.createElement('button'); b.type = 'button'; b.className = 'icon' + (cls ? ' ' + cls : '');
    b.textContent = text; b.setAttribute('aria-label', label); b.title = label; b.onclick = fn; return b;
  }
  function renderRows(){
    var box = $('rows'); box.innerHTML = '';
    var items = state.data.items;
    if (!items.length){
      var p = document.createElement('p'); p.className = 'hint'; p.textContent = '아직 직종이 없습니다. "직종 추가"를 눌러 첫 직종을 만들어 주세요.';
      box.appendChild(p); return;
    }
    items.forEach(function(it, i){
      var row = document.createElement('div'); row.className = 'row' + (it.visible ? '' : ' hidden-item');
      var n = document.createElement('input'); n.type = 'text'; n.value = it.name || ''; n.placeholder = '예: 교육행정직';
      n.setAttribute('aria-label', (i + 1) + '번째 직종명');
      n.oninput = function(){ it.name = this.value; touch(); };
      var u = document.createElement('input'); u.type = 'url'; u.value = it.url || ''; u.placeholder = 'https://forms.gle/...';
      u.setAttribute('aria-label', (i + 1) + '번째 설문 링크');
      u.oninput = function(){ it.url = this.value; touch(); };
      var tools = document.createElement('div'); tools.className = 'tools';
      tools.appendChild(btn(it.visible ? '표시' : '숨김', it.visible ? '게이트웨이에 표시 중 (누르면 숨김)' : '숨김 상태 (누르면 표시)', '', function(){ it.visible = !it.visible; touch(); renderRows(); }));
      tools.appendChild(btn('↑', '위로 이동', '', function(){ if (i > 0){ items.splice(i - 1, 0, items.splice(i, 1)[0]); touch(); renderRows(); } }));
      tools.appendChild(btn('↓', '아래로 이동', '', function(){ if (i < items.length - 1){ items.splice(i + 1, 0, items.splice(i, 1)[0]); touch(); renderRows(); } }));
      tools.appendChild(btn('삭제', '삭제', 'danger', function(){
        if (confirm('"' + (it.name || '이름 없음') + '" 직종을 삭제할까요? 저장해야 실제로 반영됩니다.')){ items.splice(i, 1); touch(); renderRows(); }
      }));
      row.appendChild(n); row.appendChild(u); row.appendChild(tools); box.appendChild(row);
    });
  }

  $('btnAdd').onclick = function(){
    state.data.items.push({ id:newId(), name:'', url:'', visible:true }); touch(); renderRows();
    var inputs = $('rows').querySelectorAll('.row input[type=text]'); if (inputs.length) inputs[inputs.length - 1].focus();
  };

  function validate(){
    var d = state.data;
    if (!String(d.title || '').trim()) return '제목을 입력해 주세요.';
    var names = {};
    for (var i = 0; i < d.items.length; i++){
      var it = d.items[i], no = (i + 1) + '번째 줄: ';
      it.name = String(it.name || '').trim(); it.url = String(it.url || '').trim();
      if (!it.name) return no + '직종명을 입력해 주세요.';
      if (names[it.name]) return no + '"' + it.name + '" 직종이 중복됩니다.';
      names[it.name] = 1;
      var ok = false; try { ok = new URL(it.url).protocol === 'https:'; } catch(e){}
      if (!ok) return no + '설문 링크는 https://로 시작하는 전체 주소여야 합니다.';
    }
    return null;
  }

  // 저장 (GitHub에 커밋)
  $('btnSave').onclick = function(){
    var err = validate();
    if (err){ msg($('saveMsg'), err, 'err'); return; }
    var c = conn();
    if (!c.token){ msg($('saveMsg'), '토큰을 입력해 주세요.', 'err'); return; }
    var body = JSON.stringify(state.data, null, 2) + '\n';
    var b = $('btnSave'); b.disabled = true;
    msg($('saveMsg'), '저장 중입니다.');
    fetch(apiUrl(c), {
      method:'PUT', headers:Object.assign({ 'Content-Type':'application/json' }, headers(c)),
      body:JSON.stringify({ message:'설문 목록 수정 (관리자 페이지)', content:toB64(body), sha:state.sha, branch:c.branch })
    })
      .then(function(r){ if (!r.ok) throw r.status; return r.json(); })
      .then(function(j){
        state.sha = j.content.sha; state.dirty = false; renderRows();
        msg($('saveMsg'), '저장했습니다. 게이트웨이에는 보통 1~2분 뒤 반영됩니다.\n반영이 안 보이면 잠시 후 게이트웨이를 새로고침해 주세요.', 'ok');
      })
      .catch(function(e){ msg($('saveMsg'), typeof e === 'number' ? explain(e) : '네트워크 오류로 저장하지 못했습니다. 연결을 확인하고 다시 시도해 주세요.', 'err'); })
      .then(function(){ b.disabled = false; });
  };

  window.addEventListener('beforeunload', function(e){ if (state.dirty){ e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
