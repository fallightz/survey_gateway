<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설문조사</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --ink:#14262B; --muted:#56676B; --line:#D3DCDA; --paper:#F7F9F8; --surface:#FFFFFF;
  --accent:#0E7C66; --accent-soft:#E3F2EE;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#E8EFEE; --muted:#9AAAA8; --line:#2C3B3E; --paper:#111A1C; --surface:#172225;
    --accent:#4CC3A6; --accent-soft:#16352F; color-scheme: dark; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.6; word-break:keep-all;
  border-top:8px solid var(--accent); min-height:100vh;
}
main{max-width:720px; margin:0 auto; padding:clamp(32px,8vw,72px) 20px 48px}
.org{margin:0; font-size:15px; color:var(--muted)}
h1{margin:6px 0 14px; font-size:clamp(28px,6vw,44px); line-height:1.2; letter-spacing:-0.02em; font-weight:700}
.notice{margin:0 0 36px; font-size:17px; color:var(--muted); max-width:36em; white-space:pre-line}
.list{list-style:none; margin:0; padding:0; border-top:2px solid var(--ink)}
.list li{border-bottom:1px solid var(--line)}
.list a{
  display:flex; align-items:center; gap:16px; padding:22px 8px;
  color:var(--ink); text-decoration:none; font-size:clamp(19px,4.5vw,23px); font-weight:600; letter-spacing:-0.01em;
}
.list a span{flex:1}
.list a svg{flex:none; width:24px; height:24px; color:var(--muted); transition:transform .15s ease}
.list a:hover, .list a:focus-visible{background:var(--accent-soft); color:var(--accent)}
.list a:hover svg, .list a:focus-visible svg{color:var(--accent); transform:translateX(4px)}
a:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
.state{padding:28px 8px; color:var(--muted); font-size:16px; border-bottom:1px solid var(--line)}
.state.error{color:#B42318}
@media (prefers-color-scheme: dark){ .state.error{color:#F97066} }
footer{margin-top:40px; font-size:14px; color:var(--muted)}
@media (prefers-reduced-motion: reduce){ .list a svg{transition:none} }
</style>
</head>
<body>
<main>
  <p class="org" id="org"></p>
  <h1 id="title">설문조사</h1>
  <p class="notice" id="notice"></p>
  <ul class="list" id="list" aria-live="polite">
    <li class="state">직종 목록을 불러오는 중입니다.</li>
  </ul>
  <footer id="contact" hidden></footer>
</main>
<script>
(function(){
  var ARROW = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  var list = document.getElementById('list');

  function setState(msg, isError){
    list.innerHTML = '';
    var li = document.createElement('li');
    li.className = 'state' + (isError ? ' error' : '');
    li.textContent = msg;
    list.appendChild(li);
  }
  function safeUrl(u){
    try { var x = new URL(u); return x.protocol === 'https:' ? x.href : null; } catch(e){ return null; }
  }

  fetch('data/surveys.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      if (d.org) document.getElementById('org').textContent = d.org;
      if (d.title){ document.getElementById('title').textContent = d.title; document.title = d.title; }
      if (d.notice) document.getElementById('notice').textContent = d.notice;
      if (d.contact){ var f = document.getElementById('contact'); f.textContent = d.contact; f.hidden = false; }

      var items = (d.items || []).filter(function(it){ return it.visible !== false && it.name && safeUrl(it.url); });
      if (!items.length){ setState('현재 진행 중인 설문이 없습니다.'); return; }

      list.innerHTML = '';
      items.forEach(function(it){
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = safeUrl(it.url);
        if (d.openInNewTab){ a.target = '_blank'; a.rel = 'noopener noreferrer'; }
        var s = document.createElement('span');
        s.textContent = it.name;
        a.appendChild(s);
        a.insertAdjacentHTML('beforeend', ARROW);
        li.appendChild(a);
        list.appendChild(li);
      });
    })
    .catch(function(){
      setState('직종 목록을 불러오지 못했습니다. 잠시 후 새로고침해 주세요.', true);
    });
})();
</script>
</body>
</html>
